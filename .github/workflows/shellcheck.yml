name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show ShellCheck version
        run: shellcheck --version
      - name: Run ShellCheck
        run: shellcheck -x install.sh uninstall.sh lib/*.sh tests/*.sh
